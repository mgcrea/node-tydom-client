name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, so a newly-published advisory is found against unchanged code.
    # Most of what CodeQL has to say here will come from a rule that did not
    # exist when the code was last touched.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Least privilege: the analysis needs to read the tree and write its results,
# and nothing else.
permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # `security-extended` over the default: this package handles account
          # credentials and builds request URIs from user-supplied config,
          # which is exactly the surface the extra queries cover.
          queries: security-extended

      # No build step. CodeQL analyses the TypeScript sources directly, and
      # `pnpm build` emits one bundled `dist/index.mjs` that would tell it less
      # than the tree already does.
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
